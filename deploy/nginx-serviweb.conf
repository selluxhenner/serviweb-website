# Serviweb — recommended nginx configuration (SEO audit 2026-07-17)
#
# Merge this into the existing server block for www.serviweb.ch on the Ubuntu
# server (usually /etc/nginx/sites-available/serviweb), then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Fixes applied here (see serviweb.ch-audit/ACTION-PLAN.md):
#   C1: real HTTP 404 for unknown paths (instead of 200 + homepage)
#   H1: immutable caching for hashed /assets/ files
#   H3: security headers + hide nginx version
#   L1: charset in Content-Type

# --- inside the `http` block (or at the top of the site file if allowed) ----
# server_tokens off;            # hide "nginx/1.24.0 (Ubuntu)" from headers

server {
    listen 443 ssl http2;
    server_name www.serviweb.ch;

    root /var/www/serviweb/dist;   # adjust to the actual dist/ path
    index index.html;
    charset utf-8;                  # L1: text/html; charset=utf-8

    # ---- H3: security headers (always = also on 404/301 responses) ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ---- H1: hashed build assets — cache forever ----
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # NOTE: add_header in a location replaces inherited ones — repeat the
        # security headers here:
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Images/icons/fonts in the web root (og-image.jpg, favicons, logos):
    # not content-hashed, so cache for 7 days only.
    location ~* \.(png|jpg|jpeg|webp|avif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---- H4: never let a browser reuse stale HTML ----
    # The server currently sends no Cache-Control for text/html, so browsers
    # fall back to heuristic freshness (~10% of the age since Last-Modified) and
    # can keep serving a weeks-old index.html. That old HTML references an
    # /assets/index-<hash>.js which no longer exists after a deploy -> the script
    # 404s, React never hydrates, and the visitor gets a permanently white page.
    # "no-cache" still allows the cached copy to be reused, but only after an
    # ETag revalidation (cheap 304), so HTML and asset hashes can never drift
    # apart. Must come BEFORE `location /` so it wins for .html requests.
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # ---- C1: prerendered routes; everything unknown is a REAL 404 ----
    # Every route has its own dist/<route>/index.html, so the SPA fallback to
    # /index.html is no longer needed — unknown paths must return 404.
    location / {
        # H4 again: `try_files` serves <route>/index.html internally, which does
        # NOT re-enter the location above — so set the header here too.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }
    error_page 404 /404.html;   # prerendered by `npm run build` (dist/404.html)

    # ---- compression (gzip is already on; keep types broad) ----
    gzip on;
    gzip_types text/html text/css application/javascript application/json
               application/xml image/svg+xml text/plain;
    gzip_min_length 1024;
    # Optional (M1): install nginx brotli module for ~15-20% smaller transfers:
    #   brotli on; brotli_types <same as gzip_types>;

    # ... existing ssl_certificate / ssl_certificate_key lines stay as-is ...
}

# The existing http→https and non-www→www 301 redirect server blocks are
# correct — keep them unchanged.

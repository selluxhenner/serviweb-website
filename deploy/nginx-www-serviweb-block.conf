# Drop-in replacement for the `server_name www.serviweb.ch` block in
# /etc/nginx/sites-available/serviweb on main-hetzner.
#
# Only two things change versus what is running today:
#   1. HTML gets `Cache-Control: no-cache`. Without it nginx sends no
#      Cache-Control at all, browsers fall back to heuristic freshness
#      (~10% of the age since Last-Modified) and can reuse HTML that is
#      weeks old. That stale HTML references an /assets/index-<hash>.js
#      which no longer exists after a redeploy -> the script 404s, React
#      never hydrates, and the visitor is left on a white page.
#      "no-cache" still permits a cached copy, but only after an ETag
#      revalidation (a cheap 304), so HTML and asset hashes cannot drift.
#   2. Hashed build assets under /assets/ are cached for a year and marked
#      immutable. They are content-hashed, so this is always safe and it
#      makes repeat visits considerably faster.
#
# `^~` on /assets/ stops any future regex location from taking priority
# over it. try_files is otherwise untouched, so 404 behaviour is unchanged.
#
# Apply:
#   sudo cp /etc/nginx/sites-available/serviweb{,.bak}
#   sudo nano /etc/nginx/sites-available/serviweb     # replace the www block
#   sudo nginx -t && sudo systemctl reload nginx

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;

  server_name www.serviweb.ch;

  ssl_certificate /etc/letsencrypt/live/serviweb.ch/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/serviweb.ch/privkey.pem;

  root /var/www/serviweb/dist;
  index index.html;

  # Content-hashed build output — safe to cache forever.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Everything else (HTML above all) must revalidate.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/index.html $uri/ /index.html;
  }
}
